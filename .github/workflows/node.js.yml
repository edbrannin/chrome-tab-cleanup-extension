# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm and Node.js ${{ matrix.node-version }}
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        runtime: node@${{ matrix.node-version }}
        version: 12.21.0
        cache: true
    - run: pnpm ci
    - run: pnpm run build
    - run: pnpm test
    - run: |
        pnpm run zip
        pnpm run zip:firefox
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
        # name: # optional, default is artifact
        # A file, directory or wildcard pattern that describes what to upload.
        path: .output/tab-cleanup-extension-*.zip
        # include-hidden-files: true
    #- name: GitHub Release
    #  if: github.event_name == 'push'
    #  uses: fnkr/github-action-ghr@96b1448dc6162f370067e1de51e856e733a76b4f # v1.3
      
